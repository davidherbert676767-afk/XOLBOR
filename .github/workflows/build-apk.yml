name: Build XOLBOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract XOLBOR project
        run: |
          unzip -q XOLBOR_GitHub_Loja_Moedas_Mais_Pacotes_CORRIGIDO_v3.zip -d xolbor_project
          cp -r xolbor_project/* .
          cp -r xolbor_project/.[!.]* . 2>/dev/null || true

      - name: Configure XOLBOR online server
        run: |
          echo "Procurando endereço antigo..."
          grep -RIl --exclude-dir=.git "10.0.2.2" . || true

          echo "Substituindo servidor antigo..."
          grep -RIl --exclude-dir=.git "10.0.2.2" . | while read file; do
            sed -i 's#http://10\.0\.2\.2:8080#https://xolbor-add5.onrender.com#g' "$file"
            sed -i 's#10\.0\.2\.2:8080#xolbor-add5.onrender.com#g' "$file"
            sed -i 's#http://10\.0\.2\.2#https://xolbor-add5.onrender.com#g' "$file"
            sed -i 's#10\.0\.2\.2#xolbor-add5.onrender.com#g' "$file"
          done

          echo "Verificando..."
          if grep -RIn --exclude-dir=.git "10.0.2.2" .; then
            echo "ERRO: o endereço antigo ainda existe!"
            exit 1
          else
            echo "OK: endereço antigo removido."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
