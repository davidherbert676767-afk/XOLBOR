name: Build XOLBOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract XOLBOR v0.3
        run: |
          unzip -q XOLBOR_v0.3_ONLINE_3D_BASE.zip -d xolbor_project
          cp -r xolbor_project/* .
          cp -r xolbor_project/.[!.]* . 2>/dev/null || true

      - name: Configure online backend
        run: |
          grep -RIl --exclude-dir=.git "10.0.2.2" . | while read file; do
            sed -i 's#http://10\.0\.2\.2:8080#https://xolbor-add5.onrender.com#g' "$file"
            sed -i 's#10\.0\.2\.2:8080#xolbor-add5.onrender.com#g' "$file"
            sed -i 's#http://10\.0\.2\.2#https://xolbor-add5.onrender.com#g' "$file"
            sed -i 's#10\.0\.2\.2#xolbor-add5.onrender.com#g' "$file"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-v0.3-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
