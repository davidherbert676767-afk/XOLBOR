name: Build XOLBOR APK v0.8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract XOLBOR v0.8
        run: |
          rm -rf xolbor_project
          unzip -q XOLBOR_v1.2.2_CRIADOR_JOGOS_COM_ITENS_CORRIGIDO.zip -d xolbor_project
          test -f xolbor_project/settings.gradle.kts
          test -f xolbor_project/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: xolbor_project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-debug-apk
          path: 'xolbor_project/app/build/outputs/apk/debug/*.apk'
