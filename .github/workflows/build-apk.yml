name: Build XOLBOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract XOLBOR project
        run: |
          unzip -q XOLBOR_GitHub_Loja_Moedas_Mais_Pacotes_CORRIGIDO_v2.zip -d xolbor_project
          cp -r xolbor_project/* .
          cp -r xolbor_project/.[!.]* . 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java 17
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 sed -i \
            -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
            -e 's/jvmTarget *= *"1\.8"/jvmTarget = "17"/g' \
            -e 's/jvmTarget *= *'\''1\.8'\''/jvmTarget = '\''17'\''/g'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XOLBOR-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
